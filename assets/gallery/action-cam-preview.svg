    <g transform="translate(0 320)" opacity=".55">
      <rect x="-270" y="0" width="540" height="85" rx="22" fill="#111a1f" stroke="#75cce3" stroke-width="2"/>
      <rect x="-120" y="20" width="240" height="24" rx="12" fill="#071015"/>
    </g>

    <rect x="-485" y="-216" width="970" height="432" rx="68" fill="url(#body)" stroke="#879ca5" stroke-opacity=".5" stroke-width="3"/>
