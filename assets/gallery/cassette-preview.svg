<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="云磁带空间预览">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="68%">
      <stop offset="0" stop-color="#314354"/>
      <stop offset=".48" stop-color="#101820"/>
      <stop offset="1" stop-color="#030607"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#545b5f"/>
      <stop offset=".48" stop-color="#272d30"/>
      <stop offset="1" stop-color="#111619"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eadb"/>
      <stop offset=".5" stop-color="#cfc4b3"/>
      <stop offset="1" stop-color="#9fa096"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e1748"/>
      <stop offset=".45" stop-color="#d05380"/>
      <stop offset=".7" stop-color="#e7a58d"/>
      <stop offset="1" stop-color="#597694"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edf1" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3e5157" stop-opacity=".12"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain">
